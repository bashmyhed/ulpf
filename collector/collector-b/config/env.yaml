# ──────────────────────────────────────────────────────────────────────────────
# ULPF Collector B — Environment Variables Reference
# ──────────────────────────────────────────────────────────────────────────────
# Component  : collector-b
# File       : config/env.yaml
# ──────────────────────────────────────────────────────────────────────────────

env:

  SITE_ID:
    default: "kol-dc1"
    description: "Data center / site identifier embedded in every log envelope."

  COLLECTOR_ID:
    default: "collector-b"
    description: "Unique collector node name for source traceability."

  KAFKA_BOOTSTRAP:
    default: "kafka:9092"
    description: "Kafka broker address(es). Comma-separated for multi-broker."
    used_in: [sinks.yaml]

  INSTANCE_ENV:
    default: "test"
    description: "Deployment environment label."
    options: [test, staging, production]

  MOCK_MODE:
    default: "false"
    description: "Enables built-in mock JSON/CSV log generators (entrypoint.sh)."
    options: [true, false]

  VECTOR_LOG:
    default: "info"
    description: "Vector process log verbosity."
    options: [trace, debug, info, warn, error]
