# ──────────────────────────────────────────────────────────────────────────────
# ULPF Collector A — Environment Variables Reference
# ──────────────────────────────────────────────────────────────────────────────
# Component  : collector-a
# File       : config/env.yaml
# Description: Documents all environment variables for collector-a.
#              NOT loaded by Vector — use as reference for docker-compose /
#              Kubernetes ConfigMaps / Helm values.
# ──────────────────────────────────────────────────────────────────────────────

env:

  SITE_ID:
    default: "kol-dc1"
    description: "Data center or site identifier. Embedded in every log envelope."
    example: "del-dc2"

  COLLECTOR_ID:
    default: "collector-a"
    description: "Unique name for this collector node. Used for traceability."
    example: "collector-a-node2"

  KAFKA_BOOTSTRAP:
    default: "kafka:9092"
    description: "Kafka broker host:port. Supports comma-separated multiple brokers."
    used_in: [sinks.yaml]

  INSTANCE_ENV:
    default: "test"
    description: "Deployment environment label attached to every event envelope."
    options: [test, staging, production]

  MOCK_MODE:
    default: "false"
    description: "Set to 'true' to start built-in mock log emulators (entrypoint.sh)."
    options: [true, false, "1", "0"]

  VECTOR_LOG:
    default: "info"
    description: "Vector process log level."
    options: [trace, debug, info, warn, error]
