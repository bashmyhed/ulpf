# ──────────────────────────────────────────────────────────────────────────────
# ULPF Collector C — Environment Variables Reference
# ──────────────────────────────────────────────────────────────────────────────
# Component  : collector-c
# File       : config/env.yaml
# Description: Documents all environment variables for collector-c.
#              NOT loaded by Vector — use as reference for docker-compose /
#              Kubernetes ConfigMaps / Helm values.
# ──────────────────────────────────────────────────────────────────────────────

env:

  SITE_ID:
    default: "kol-dc1"
    description: "Data center / site identifier embedded in every log envelope."
    example: "del-dc2"

  COLLECTOR_ID:
    default: "collector-c"
    description: "Unique collector node name. Appears in unmapped.collector_id on every OCSF event."
    example: "collector-c-dc2"

  KAFKA_BOOTSTRAP:
    default: "kafka:9092"
    description: "Kafka broker host:port. Supports comma-separated multiple brokers."
    used_in: [sinks.yaml]

  INSTANCE_ENV:
    default: "test"
    description: "Deployment environment label attached to every event envelope."
    options: [test, staging, production]

  MOCK_MODE:
    default: "false"
    description: "Set to 'true' to start built-in mock Windows EVTX XML generator (entrypoint.sh)."
    options: [true, false, "1", "0"]

  VECTOR_LOG:
    default: "info"
    description: "Vector process log verbosity."
    options: [trace, debug, info, warn, error]
