# ──────────────────────────────────────────────────────────────────────────────
# ULPF Collector C — Transform: Envelope Builder
# ──────────────────────────────────────────────────────────────────────────────
# Component  : collector-c
# File       : config/transform.yaml
# Description: Classifies Windows EVTX XML events by subtype, then wraps
#              in the ULPF Envelope schema (metadataGuide v1).
#
# Classification rules (applied in priority order):
#   1. Sysmon:     contains "Sysmon"      → source.type = windows.sysmon
#   2. PowerShell: contains "PowerShell"  → source.type = windows.powershell
#   3. Default:    all other XML          → source.type = windows.security
#
# Env vars consumed:
#   SITE_ID, COLLECTOR_ID, INSTANCE_ENV
# ──────────────────────────────────────────────────────────────────────────────

transforms:
  envelope_c:
    type: remap
    inputs:
      - xml_files
    source: |
      # ── 1. Validate payload ────────────────────────────────────────────────
      raw_msg = string!(.message)
      if length(raw_msg) == 0 { abort }

      # ── 2. Compute raw metrics ─────────────────────────────────────────────
      raw_sha256 = sha2(raw_msg)
      raw_len    = length(raw_msg)
      coll_time  = to_unix_timestamp(now(), unit: "milliseconds")
      site_id    = get_env_var("SITE_ID") ?? "mum-dc3"
      site_name  = "Site C"
      agent_id   = get_env_var("AGENT_ID") ?? get_env_var("COLLECTOR_ID") ?? "agent-c"
      fpath      = string(.file_path) ?? "/logs/xml/windows_events.log"

      # ── 3. Classification conforming to metadataGuide Section 4.5 & 5 ─────
      src_type   = "windows.security"
      vendor     = "Microsoft"
      product    = "Security-Auditing"
      raw_format = "evtx_xml"
      channel    = "Security"
      provider   = "Microsoft-Windows-Security-Auditing"

      # Subtype detection
      if contains(raw_msg, "Sysmon") {
        src_type = "windows.sysmon"
        product  = "Sysmon"
        channel  = "Microsoft-Windows-Sysmon/Operational"
        provider = "Microsoft-Windows-Sysmon"
      } else if contains(raw_msg, "PowerShell") {
        src_type = "windows.powershell"
        product  = "PowerShell"
        channel  = "Microsoft-Windows-PowerShell/Operational"
        provider = "PowerShell"
      }

      # ── 4. Build ULPF Envelope (metadataGuide Section 2 & 3) ───────────────
      . = {
        "envelope_version": 1,
        "site_id": site_id,
        "site_name": site_name,
        "agent_id": agent_id,
        "collector_id": agent_id,
        "agent_version": "1.0.0",
        "collector_version": "1.0.0",
        "seq": coll_time,
        "collected_at": coll_time,
        "source_tz": "+05:30",
        "clock": {
          "synced": true,
          "skew_ms": 0
        },
        "source": {
          "type": src_type,
          "vendor": vendor,
          "product": product,
          "product_version": "unknown",
          "transport": "file",
          "host_name": get_hostname() ?? agent_id,
          "host_ip": null,
          "sender_ip": null,
          "sender_port": null,
          "host_id": null,
          "position": {
            "path": fpath,
            "inode": null,
            "offset": null,
            "line_no": null
          },
          "evtx": {
            "channel": channel,
            "provider": provider
          }
        },
        "raw_format": raw_format,
        "raw_encoding": "utf-8",
        "raw_len": raw_len,
        "raw_sha256": raw_sha256,
        "raw": raw_msg,
        "flags": {
          "truncated": false,
          "multiline_joined": false,
          "decoded_from": null,
          "redacted": false,
          "duplicate_suspect": false
        },
        "labels": {
          "env": get_env_var("INSTANCE_ENV") ?? "test",
          "site": "Site C",
          "tier": "agent-c"
        }
      }
