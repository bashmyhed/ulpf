# ──────────────────────────────────────────────────────────────────────────────
# ULPF Collector C — Sinks
# ──────────────────────────────────────────────────────────────────────────────
# Component  : collector-c
# File       : config/sinks.yaml
# Env vars   : KAFKA_BOOTSTRAP (default: kafka:9092)
# ──────────────────────────────────────────────────────────────────────────────

sinks:

  # Primary: Kafka upstream to central parser
  kafka_out:
    type: kafka
    inputs:
      - envelope_c
    bootstrap_servers: "${KAFKA_BOOTSTRAP}"
    topic: "ulpf-raw-logs"
    encoding:
      codec: json
    buffer:
      type: memory
      max_events: 1000
      when_full: block

  # Debug: local NDJSON mirror
  local_debug:
    type: file
    inputs:
      - envelope_c
    path: /logs/debug/instance-c-sent.ndjson
    encoding:
      codec: json
