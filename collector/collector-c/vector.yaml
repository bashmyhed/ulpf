# Vector Collector — Instance C
# Conforms to ULPF Collector Metadata Guide (v1)
# Sources: Windows Event Log XML (Security Auditing, Sysmon)

api:
  enabled: true
  address: "0.0.0.0:8686"
  playground: false

sources:
  host_sys:
    type: host_metrics
    scrape_interval_secs: 15

  internal_metrics:
    type: internal_metrics

  xml_files:
    type: file
    include:
      - /logs/syslog/windows_events.log
      - /logs/xml/*.log
      - /logs/xml/*.xml
    read_from: beginning
    ignore_checkpoints: true
    file_key: file_path

transforms:
  envelope_c:
    type: remap
    inputs:
      - xml_files
    source: |
      # ── 1. Validate payload ────────────────────────────────────────────────
      raw_msg = string!(.message)
      if length(raw_msg) == 0 { abort }

      # ── 2. Compute raw metrics ─────────────────────────────────────────────
      raw_sha256 = sha2(raw_msg)
      raw_len    = length(raw_msg)
      coll_time  = to_unix_timestamp(now(), unit: "milliseconds")
      site_id    = get_env_var("SITE_ID") ?? "mum-dc3"
      site_name  = "Site C"
      agent_id   = get_env_var("AGENT_ID") ?? get_env_var("COLLECTOR_ID") ?? "agent-c"
      fpath      = string(.file_path) ?? "/logs/xml/windows_events.log"

      # ── 3. Classification conforming to metadataGuide Section 4.5 & 5 ─────
      src_type   = "windows.security"
      vendor     = "Microsoft"
      product    = "Security-Auditing"
      raw_format = "evtx_xml"
      channel    = "Security"
      provider   = "Microsoft-Windows-Security-Auditing"

      # Subtype detection
      if contains(raw_msg, "Sysmon") {
        src_type = "windows.sysmon"
        product  = "Sysmon"
        channel  = "Microsoft-Windows-Sysmon/Operational"
        provider = "Microsoft-Windows-Sysmon"
      } else if contains(raw_msg, "PowerShell") {
        src_type = "windows.powershell"
        product  = "PowerShell"
        channel  = "Microsoft-Windows-PowerShell/Operational"
        provider = "PowerShell"
      }

      # ── 4. Build ULPF Envelope (metadataGuide Section 2 & 3) ───────────────
      . = {
        "envelope_version": 1,
        "site_id": site_id,
        "site_name": site_name,
        "agent_id": agent_id,
        "collector_id": agent_id,
        "agent_version": "1.0.0",
        "collector_version": "1.0.0",
        "seq": coll_time,
        "collected_at": coll_time,
        "source_tz": "+05:30",
        "clock": {
          "synced": true,
          "skew_ms": 0
        },
        "source": {
          "type": src_type,
          "vendor": vendor,
          "product": product,
          "product_version": "unknown",
          "transport": "file",
          "host_name": get_hostname() ?? agent_id,
          "host_ip": null,
          "sender_ip": null,
          "sender_port": null,
          "host_id": null,
          "position": {
            "path": fpath,
            "inode": null,
            "offset": null,
            "line_no": null
          },
          "evtx": {
            "channel": channel,
            "provider": provider
          }
        },
        "raw_format": raw_format,
        "raw_encoding": "utf-8",
        "raw_len": raw_len,
        "raw_sha256": raw_sha256,
        "raw": raw_msg,
        "flags": {
          "truncated": false,
          "multiline_joined": false,
          "decoded_from": null,
          "redacted": false,
          "duplicate_suspect": false
        },
        "labels": {
          "env": get_env_var("INSTANCE_ENV") ?? "prod",
          "site": "Site C",
          "tier": "agent-c"
        }
      }

sinks:
  kafka_out:
    type: kafka
    inputs:
      - envelope_c
    bootstrap_servers: "${KAFKA_BOOTSTRAP}"
    topic: "ulpf-raw-logs"
    encoding:
      codec: json
    buffer:
      type: memory
      max_events: 1000
      when_full: block

  local_debug:
    type: file
    inputs:
      - envelope_c
    path: /logs/debug/instance-c-sent.ndjson
    encoding:
      codec: json

  prometheus_metrics:
    type: prometheus_exporter
    inputs:
      - host_sys
      - internal_metrics
    address: "0.0.0.0:9598"
