services:

  # ── Config Server ─────────────────────────────────────────────────────────────
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: ulpf-config-server
    hostname: config-server
    ports:
      - "8080:8080"
    volumes:
      - /home/paul/projects/sih2/config-repo:/opt/ulpf-config.git:ro
      - ./config-server/secrets:/etc/ulpf/secrets:ro
      - config-server-data:/data
    environment:
      - ADMIN_TOKEN=admin-token
      - AGENT_TOKENS=collector-a-token:agent-a-01:kol-dc1,collector-b-token:agent-b-01:del-dc2,collector-c-token:agent-c-01:mum-dc3,central-token:server-parser-01:kol-dc1,collector-a-token:collector-a-01:kol-dc1,collector-b-token:collector-b-01:kol-dc1,collector-c-token:collector-c-01:kol-dc1,central-token:central-01:kol-dc1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Apache Kafka (KRaft mode, no Zookeeper) ───────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: ulpf-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_RETENTION_HOURS=1
      - CLUSTER_ID=ulpf-kafka-cluster-001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Topic Provisioner ───────────────────────────────────────────────
  kafka-setup:
    image: apache/kafka:3.7.0
    container_name: ulpf-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic ulpf-raw-logs --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic ulpf-dlq --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic ulpf-ocsf-events --partitions 3 --replication-factor 1 &&
        echo "Topics created:" &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  # ── MinIO S3 Object Storage (Data Lake) ───────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: ulpf-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO Bucket Initializer ──────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: ulpf-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/ulpf-data-lake &&
        echo 'MinIO bucket ulpf-data-lake initialized.'
      "
    restart: "no"

  # ── Agent A: Network & Security (Syslog / CEF / LEEF) ─────────────────────
  collector-a:
    build:
      context: ./collector/collector-a
      dockerfile: Dockerfile
    container_name: ulpf-collector-a
    hostname: collector-a
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
    environment:
      - CONFIG_SERVER_URL=http://config-server:8080
      - AGENT_TOKEN=collector-a-token
      - SITE_ID=kol-dc1
      - MACHINE_ID=agent-a-01
      - AGENT_ID=agent-a
      - COLLECTOR_ID=agent-a
      - COLLECTOR_TYPE=agent-a
      - AGENT_TYPE=agent-a
      - VECTOR_CONFIG_DIR=/etc/vector
      - STAGING_DIR=/staging
      - BACKUP_DIR=/backup
      - VECTOR_PID_FILE=/run/vector.pid
      - KAFKA_BOOTSTRAP=kafka:9092
      - MOCK_MODE=true
    volumes:
      - collector-a-logs:/logs
      - collector-a-staging:/staging
      - collector-a-backup:/backup
      - collector-a-config:/etc/vector
    restart: unless-stopped

  # ── Agent B: Apps & Cloud (JSON / CSV) ─────────────────────────────────────
  collector-b:
    build:
      context: ./collector/collector-b
      dockerfile: Dockerfile
    container_name: ulpf-collector-b
    hostname: collector-b
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
    environment:
      - CONFIG_SERVER_URL=http://config-server:8080
      - AGENT_TOKEN=collector-b-token
      - SITE_ID=del-dc2
      - MACHINE_ID=agent-b-01
      - AGENT_ID=agent-b
      - COLLECTOR_ID=agent-b
      - COLLECTOR_TYPE=agent-b
      - AGENT_TYPE=agent-b
      - VECTOR_CONFIG_DIR=/etc/vector
      - STAGING_DIR=/staging
      - BACKUP_DIR=/backup
      - VECTOR_PID_FILE=/run/vector.pid
      - KAFKA_BOOTSTRAP=kafka:9092
      - MOCK_MODE=true
    volumes:
      - collector-b-logs:/logs
      - collector-b-staging:/staging
      - collector-b-backup:/backup
      - collector-b-config:/etc/vector
    restart: unless-stopped

  # ── Agent C: Windows Endpoint Audit (EVTX XML) ─────────────────────────────
  collector-c:
    build:
      context: ./collector/collector-c
      dockerfile: Dockerfile
    container_name: ulpf-collector-c
    hostname: collector-c
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
    environment:
      - CONFIG_SERVER_URL=http://config-server:8080
      - AGENT_TOKEN=collector-c-token
      - SITE_ID=mum-dc3
      - MACHINE_ID=agent-c-01
      - AGENT_ID=agent-c
      - COLLECTOR_ID=agent-c
      - COLLECTOR_TYPE=agent-c
      - AGENT_TYPE=agent-c
      - VECTOR_CONFIG_DIR=/etc/vector
      - STAGING_DIR=/staging
      - BACKUP_DIR=/backup
      - VECTOR_PID_FILE=/run/vector.pid
      - KAFKA_BOOTSTRAP=kafka:9092
      - MOCK_MODE=true
    volumes:
      - collector-c-logs:/logs
      - collector-c-staging:/staging
      - collector-c-backup:/backup
      - collector-c-config:/etc/vector
    restart: unless-stopped

  # ── Server Processor & Normalizer ──────────────────────────────────────────
  central-parser:
    build:
      context: ./central
      dockerfile: Dockerfile
    container_name: ulpf-central-parser
    hostname: central-parser
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
    environment:
      - CONFIG_SERVER_URL=http://config-server:8080
      - AGENT_TOKEN=central-token
      - SITE_ID=kol-dc1
      - MACHINE_ID=server-parser-01
      - AGENT_ID=server-parser
      - COLLECTOR_ID=server-parser
      - COLLECTOR_TYPE=server
      - AGENT_TYPE=server
      - VECTOR_CONFIG_DIR=/etc/vector
      - STAGING_DIR=/staging
      - BACKUP_DIR=/backup
      - VECTOR_PID_FILE=/run/vector.pid
      - KAFKA_BOOTSTRAP=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=ulpf-data-lake
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - OPENSEARCH_ENDPOINT=http://opensearch:9200
    volumes:
      - output-data:/output
      - central-staging:/staging
      - central-backup:/backup
      - central-config:/etc/vector
    restart: unless-stopped

  # ── OpenSearch (Search & Analytics Engine) ──────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ulpf-opensearch
    hostname: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin_Password123!
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=false
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── OpenSearch Dashboards (Visualization UI) ─────────────────────────────
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: ulpf-opensearch-dashboards
    hostname: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy

  # ── Machine Learning Anomaly Worker ──────────────────────────────────────
  ml-worker:
    build:
      context: ./ml
    container_name: sih2-ml-worker-1
    command:
      - ulpf-ml
      - worker
      - --models
      - /app/models
      - --state
      - /state/worker.sqlite
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ml-state:/state
    restart: on-failure
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json; from pathlib import Path; p=Path('/state/health.json'); assert p.exists() and json.loads(p.read_text()).get('status') == 'running'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  kafka-data:
  minio-data:
  collector-a-logs:
  collector-b-logs:
  collector-c-logs:
  output-data:
  opensearch-data:
  ml-state:
  collector-a-staging:
  collector-b-staging:
  collector-c-staging:
  central-staging:
  collector-a-backup:
  collector-b-backup:
  collector-c-backup:
  central-backup:
  collector-a-config:
  collector-b-config:
  collector-c-config:
  central-config:
  config-server-data: