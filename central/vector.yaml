          "event_code":     evt_name,
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "observables": [
          { "name": "src_ip",   "type_id": 2, "value": src_ip },
          { "name": "username", "type_id": 4, "value": username }
        ],
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   "json",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }

  # ── OCSF: K8s Audit JSON → 6003 API Activity ─────────────────────────────────
  parse_k8s_audit:
    type: remap
    inputs:
      - route_source_type.k8s_audit
    source: |
      raw_str   = to_string(.raw) ?? ""
      parsed    = parse_json(raw_str) ?? {}
      user_obj  = object(parsed.user) ?? {}
      username  = to_string(user_obj.username) ?? "unknown"
      verb      = string(parsed.verb) ?? "unknown"
      obj_ref   = object(parsed.objectRef) ?? {}
      resource  = to_string(obj_ref.resource) ?? ""
      namespace = to_string(obj_ref.namespace) ?? ""
      src_ips   = array(parsed.sourceIPs) ?? []
      src_ip    = to_string(src_ips[0]) ?? ""
      resp_st   = object(parsed.responseStatus) ?? {}
      code      = to_int(resp_st.code) ?? 200
      audit_id  = string(parsed.auditID) ?? ""
      res_label = if resource != "" { resource } else { "k8s" }

      sev_id   = if code >= 400 { 3 } else { 1 }
      sev_name = if code >= 400 { "Medium" } else { "Informational" }
      st_name  = if code >= 400 { "Failure" } else { "Success" }
      st_id    = if code >= 400 { 2 } else { 1 }

      src_obj   = object(.source) ?? {}
      event_id  = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    6003,
        "class_name":   "API Activity",
        "category_uid": 6,
        "activity_id":  1,
        "severity_id":  sev_id,
        "severity":     sev_name,
        "status":       st_name,
        "status_id":    st_id,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "timestamp":    coll_time,
        "message":      username + " " + verb + " " + res_label,
        "src_endpoint": { "ip": src_ip, "type_id": 1 },
        "actor":        { "user": { "name": username } },
        "api": {
          "operation": verb,
          "service":   { "name": "kubernetes" },
          "group":     { "name": namespace }
        },
        "metadata": {
          "uid":            event_id,
          "version":        "1.3.0",
          "product": {
            "name":        to_string(src_obj.product) ?? "Kubernetes",
            "vendor_name": to_string(src_obj.vendor) ?? "CNCF",
            "version":     to_string(src_obj.product_version) ?? "unknown"
          },
          "log_provider":   "k8s_audit",
          "log_name":       to_string(src_obj.type) ?? "k8s.audit",
          "event_code":     audit_id,
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "observables": [
          { "name": "src_ip",   "type_id": 2, "value": src_ip },
          { "name": "username", "type_id": 4, "value": username }
        ],
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   "json",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }

  # ── OCSF: IoT Telemetry → 2001 Device Activity ───────────────────────────────
  parse_iot_sensor:
    type: remap
    inputs:
      - route_source_type.iot_sensor
    source: |
      raw_str     = to_string(.raw) ?? ""
      parsed      = parse_json(raw_str) ?? {}
      device_id   = string(parsed.device_id) ?? "unknown"
      sensor_type = string(parsed.sensor_type) ?? "unknown"
      value       = to_float(parsed.value) ?? 0.0
      unit        = string(parsed.unit) ?? ""
      stat_raw    = string(parsed.status) ?? "ok"
      dev_status  = downcase(stat_raw)

      sev_id   = if dev_status == "error" { 4 } else if dev_status == "warning" { 3 } else { 1 }
      sev_name = if dev_status == "error" { "High" } else if dev_status == "warning" { "Medium" } else { "Informational" }
      st_name  = if dev_status == "ok" { "Success" } else { "Failure" }
      st_id    = if dev_status == "ok" { 1 } else { 2 }

      src_obj   = object(.source) ?? {}
      event_id  = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    2001,
        "class_name":   "Device Activity",
        "category_uid": 2,
        "activity_id":  1,
        "severity_id":  sev_id,
        "severity":     sev_name,
        "status":       st_name,
        "status_id":    st_id,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "timestamp":    coll_time,
        "message":      device_id + " " + sensor_type + "=" + to_string(value) + unit + " [" + dev_status + "]",
        "device": {
          "uid":     device_id,
          "type_id": 17,
          "type":    "IoT Device"
        },
        "metadata": {
          "uid":            event_id,
          "version":        "1.3.0",
          "product": {
            "name":        to_string(src_obj.product) ?? "IoT",
            "vendor_name": to_string(src_obj.vendor) ?? "unknown",
            "version":     to_string(src_obj.product_version) ?? "unknown"
          },
          "log_provider":   "iot",
          "log_name":       to_string(src_obj.type) ?? "iot.sensor",
          "event_code":     null,
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "observables": [
          { "name": "device_id", "type_id": 1, "value": device_id }
        ],
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   "json",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }

  # ── OCSF: PostgreSQL CSV → 4003 Database Activity ────────────────────────────
  parse_postgres_db:
    type: remap
    inputs:
      - route_source_type.postgres_db
    source: |
      raw_str     = to_string(.raw) ?? ""
      rows        = parse_csv(raw_str) ?? []
      row         = rows[0]
      pid         = string(row[1]) ?? ""
      db_user     = string(row[2]) ?? ""
      database    = string(row[3]) ?? ""
      duration_ms = int(row[4]) ?? 0
      sev_raw     = string(row[5]) ?? "log"
      sev_str     = downcase(sev_raw)
      query       = string(row[6]) ?? ""

      sev_id  = if sev_str == "error" { 4 } else { 1 }
      st_name = if sev_str == "error" { "Failure" } else { "Success" }
      st_id   = if sev_str == "error" { 2 } else { 1 }

      src_obj   = object(.source) ?? {}
      event_id  = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    4003,
        "class_name":   "Database Activity",
        "category_uid": 4,
        "activity_id":  1,
        "severity_id":  sev_id,
        "severity":     upcase(sev_str),
        "status":       st_name,
        "status_id":    st_id,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "timestamp":    coll_time,
        "message":      "PostgreSQL: " + upcase(sev_str) + " pid=" + pid + " db=" + database,
        "database": {
          "name":    database,
          "type_id": 3,
          "type":    "PostgreSQL"
        },
        "actor": { "user": { "name": db_user } },
        "query": { "text": query },
        "metadata": {
          "uid":            event_id,
          "version":        "1.3.0",
          "product": {
            "name":        to_string(src_obj.product) ?? "PostgreSQL",
            "vendor_name": to_string(src_obj.vendor) ?? "PostgreSQL",
            "version":     to_string(src_obj.product_version) ?? "unknown"
          },
          "log_provider":   "csv",
          "log_name":       to_string(src_obj.type) ?? "db.postgres",
          "event_code":     null,
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   "csv",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "duration_ms":  duration_ms,
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }

  # ── OCSF: Windows EVTX XML → 4801 Audit Activity ─────────────────────────────
  parse_windows_evtx:
    type: remap
    inputs:
      - route_source_type.windows_evtx
    source: |
      raw_str = to_string(.raw) ?? ""
      parsed  = parse_xml(raw_str) ?? {}
      event   = object(parsed.Event) ?? {}
      sys     = object(event.System) ?? {}
      evtdata = object(event.EventData) ?? {}

      event_id_raw = sys.EventID
      event_code   = if is_object(event_id_raw) {
        to_string(get(event_id_raw, ["#text"]) ?? values(event_id_raw)[0] ?? "") ?? ""
      } else {
        to_string(event_id_raw) ?? ""
      }

      computer = to_string(sys.Computer) ?? to_string(.source.host_name) ?? "unknown"

      msg_field = evtdata.Message
      fallback  = "Windows Event " + event_code
      msg = if is_object(msg_field) {
        to_string(get(msg_field, ["#text"]) ?? values(msg_field)[0] ?? fallback) ?? fallback
      } else if msg_field != null {
        to_string(msg_field) ?? fallback
      } else {
        fallback
      }

      src_obj   = object(.source) ?? {}
      uid       = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    4801,
        "class_name":   "Audit Activity",
        "category_uid": 4,
        "activity_id":  1,
        "severity_id":  1,
        "severity":     "Informational",
        "status":       "Other",
        "status_id":    99,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "timestamp":    coll_time,
        "message":      msg,
        "src_endpoint": { "hostname": computer, "type_id": 1 },
        "metadata": {
          "uid":            uid,
          "version":        "1.3.0",
          "product": {
            "name":        to_string(src_obj.product) ?? "Security-Auditing",
            "vendor_name": to_string(src_obj.vendor) ?? "Microsoft",
            "version":     to_string(src_obj.product_version) ?? "unknown"
          },
          "log_provider":   "xml",
          "log_name":       to_string(src_obj.type) ?? "windows.security",
          "event_code":     event_code,
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "observables": [
          { "name": "hostname",   "type_id": 1, "value": computer },
          { "name": "event_code", "type_id": 9, "value": event_code }
        ],
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   "evtx_xml",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }

  # ── OCSF: Unknown fallback ────────────────────────────────────────────────────
  parse_unknown:
    type: remap
    inputs:
      - route_source_type._unmatched
    source: |
      raw_str   = string!(.raw)
      src_obj   = object(.source) ?? {}
      uid       = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    0,
        "class_name":   "Unknown",
        "category_uid": 0,
        "activity_id":  0,
        "severity_id":  0,
        "severity":     "Unknown",
        "status":       "Other",
        "status_id":    99,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "timestamp":    coll_time,
        "message":      truncate(raw_str, 200),
        "metadata": {
          "uid":            uid,
          "version":        "1.3.0",
          "product":        { "name": "unknown", "vendor_name": "unknown", "version": "unknown" },
          "log_provider":   "unknown",
          "log_name":       to_string(src_obj.type) ?? "unknown",
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   to_string(.raw_format) ?? "unknown",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }

# ── Sinks ──────────────────────────────────────────────────────────────────────
sinks:

  # ── 1. MinIO Raw Data Lake (full envelope + raw, gzip, sitewise partitions) ──
  minio_raw_lake:
    type: aws_s3
    inputs:
      - stamp_and_verify
    bucket: "${MINIO_BUCKET:-ulpf-data-lake}"
    endpoint: "${MINIO_ENDPOINT:-http://minio:9000}"
    region: "us-east-1"
    key_prefix: "raw-preservation/site={{ site_id }}/source_type={{ source.type }}/date=%Y-%m-%d/"
    filename_extension: "ndjson.gz"
    auth:
      access_key_id: "${MINIO_ROOT_USER:-minioadmin}"
      secret_access_key: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    encoding:
      codec: json
    compression: gzip
    batch:
      timeout_secs: 5
    buffer:
      type: memory
      max_events: 500
      when_full: block

  # Local mirror of raw preservation (uncompressed for easy inspection)
  local_raw_lake:
    type: file
    inputs:
      - stamp_and_verify
    path: "/output/raw-lake/preservation-events.ndjson"
    encoding:
      codec: json

  # ── 2. OCSF Normalized Event Stream (slim, no raw logs) ──────────────────────
  ocsf_all:
    type: file
    inputs:
      - parse_cisco_asa
      - parse_linux_auth
      - parse_paloalto_cef
      - parse_qradar_leef
      - parse_nginx_access
      - parse_cloudtrail
      - parse_k8s_audit
      - parse_iot_sensor
      - parse_postgres_db
      - parse_windows_evtx
      - parse_unknown
    path: "/output/ocsf-events.ndjson"
    encoding:
      codec: json

  # ── 3. Console (live debug) ───────────────────────────────────────────────────
  console_out:
    type: console
    inputs:
      - parse_cisco_asa
      - parse_linux_auth
      - parse_paloalto_cef
      - parse_qradar_leef
      - parse_nginx_access
      - parse_cloudtrail
      - parse_k8s_audit
      - parse_iot_sensor
      - parse_postgres_db
      - parse_windows_evtx
      - parse_unknown
    encoding:
      codec: json

  # ── 4. OpenSearch SIEM Analytics & Visualization ─────────────────────────────
  opensearch_sink:
    type: elasticsearch
    inputs:
      - parse_cisco_asa
      - parse_linux_auth
      - parse_paloalto_cef
      - parse_qradar_leef
      - parse_nginx_access
      - parse_cloudtrail
      - parse_k8s_audit
      - parse_iot_sensor
      - parse_postgres_db
      - parse_windows_evtx
      - parse_unknown
    endpoints:
      - "${OPENSEARCH_ENDPOINT:-http://opensearch:9200}"
    api_version: "v8"
    mode: "bulk"
    bulk:
      index: "ulpf-ocsf-%Y.%m.%d"
    healthcheck:
      enabled: false
    buffer:
      type: memory
      max_events: 500
      when_full: block

  ml_ocsf_kafka:
    type: kafka
    inputs:
    - parse_cisco_asa
    - parse_linux_auth
    - parse_paloalto_cef
    - parse_qradar_leef
    - parse_nginx_access
    - parse_cloudtrail
    - parse_k8s_audit
    - parse_iot_sensor
    - parse_postgres_db
    - parse_windows_evtx
    - parse_unknown
    bootstrap_servers: "${KAFKA_BOOTSTRAP}"
    topic: ulpf-ocsf-events
    encoding:
      codec: json
    buffer:
      type: disk
      max_size: 268435488
      when_full: block

  prometheus_metrics:
    type: prometheus_exporter
    inputs:
      - host_sys
      - internal_metrics
    address: "0.0.0.0:9598"
