# ──────────────────────────────────────────────────────────────────────────────
# ULPF Central Parser — Environment Variables Reference
# ──────────────────────────────────────────────────────────────────────────────
# Component  : central-parser
# File       : config/env.yaml
# Description: Documents all environment variables consumed by the central
#              parser. This file is NOT loaded by Vector directly — it serves
#              as a human-readable reference for docker-compose, Kubernetes
#              ConfigMaps, or CI/CD pipelines.
#
# Usage: Pass these as environment variables in docker-compose.yml:
#   environment:
#     KAFKA_BOOTSTRAP: kafka:9092
#     MINIO_ENDPOINT: http://minio:9000
# ──────────────────────────────────────────────────────────────────────────────

env:

  # ── Kafka ──────────────────────────────────────────────────────────────────
  KAFKA_BOOTSTRAP:
    default: "kafka:9092"
    description: "Comma-separated list of Kafka broker host:port pairs."
    used_in: [sources.yaml]

  # ── MinIO / S3 ─────────────────────────────────────────────────────────────
  MINIO_ENDPOINT:
    default: "http://minio:9000"
    description: "MinIO S3-compatible endpoint URL for raw data lake writes."
    used_in: [sinks.yaml]

  MINIO_BUCKET:
    default: "ulpf-data-lake"
    description: "S3 bucket name for raw log preservation."
    used_in: [sinks.yaml]

  MINIO_ROOT_USER:
    default: "minioadmin"
    description: "MinIO access key ID (S3 access key)."
    used_in: [sinks.yaml]

  MINIO_ROOT_PASSWORD:
    default: "minioadmin"
    description: "MinIO secret access key."
    used_in: [sinks.yaml]
    secret: true

  # ── OpenSearch ─────────────────────────────────────────────────────────────
  OPENSEARCH_ENDPOINT:
    default: "http://opensearch:9200"
    description: "OpenSearch (or Elasticsearch 8-compatible) endpoint URL."
    used_in: [sinks.yaml]

  # ── Vector Runtime ─────────────────────────────────────────────────────────
  VECTOR_LOG:
    default: "info"
    description: "Vector log level. Options: trace, debug, info, warn, error."
    options: [trace, debug, info, warn, error]
