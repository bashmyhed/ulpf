# ──────────────────────────────────────────────────────────────────────────────
# ULPF Central Parser — OCSF Parser: PostgreSQL CSV Audit Log
# ──────────────────────────────────────────────────────────────────────────────
# Component  : central-parser
# File       : config/transforms/11_parse_postgres_db.yaml
# Log Format : CSV — PostgreSQL log_destination=csvlog
#              Columns (0-indexed): timestamp(0), pid(1), user(2), dbname(3),
#              duration_ms(4), severity(5), query(6)
# OCSF Class : Database Activity (class_uid: 4003, category_uid: 4)
# Source Type: db.postgres
# Input      : route_source_type.postgres_db
# ──────────────────────────────────────────────────────────────────────────────

transforms:
  parse_postgres_db:
    type: remap
    inputs:
      - route_source_type.postgres_db
    source: |
      raw_str     = to_string(.raw) ?? ""
      rows        = parse_csv(raw_str) ?? []
      row         = rows[0]
      pid         = string(row[1]) ?? ""
      db_user     = string(row[2]) ?? ""
      database    = string(row[3]) ?? ""
      duration_ms = int(row[4]) ?? 0
      sev_raw     = string(row[5]) ?? "log"
      sev_str     = downcase(sev_raw)
      query       = string(row[6]) ?? ""

      sev_id  = if sev_str == "error" { 4 } else { 1 }
      st_name = if sev_str == "error" { "Failure" } else { "Success" }
      st_id   = if sev_str == "error" { 2 } else { 1 }

      src_obj   = object(.source) ?? {}
      event_id  = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    4003,
        "class_name":   "Database Activity",
        "category_uid": 4,
        "activity_id":  1,
        "severity_id":  sev_id,
        "severity":     upcase(sev_str),
        "status":       st_name,
        "status_id":    st_id,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "message":      "PostgreSQL: " + upcase(sev_str) + " pid=" + pid + " db=" + database,
        "database": {
          "name":    database,
          "type_id": 3,
          "type":    "PostgreSQL"
        },
        "actor": { "user": { "name": db_user } },
        "query": { "text": query },
        "metadata": {
          "uid":            event_id,
          "version":        "1.3.0",
          "product": {
            "name":        to_string(src_obj.product) ?? "PostgreSQL",
            "vendor_name": to_string(src_obj.vendor) ?? "PostgreSQL",
            "version":     to_string(src_obj.product_version) ?? "unknown"
          },
          "log_provider":   "csv",
          "log_name":       to_string(src_obj.type) ?? "db.postgres",
          "event_code":     null,
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   "csv",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "duration_ms":  duration_ms,
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }
