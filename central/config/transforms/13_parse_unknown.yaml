# ──────────────────────────────────────────────────────────────────────────────
# ULPF Central Parser — OCSF Parser: Unknown / Unmatched Fallback
# ──────────────────────────────────────────────────────────────────────────────
# Component  : central-parser
# File       : config/transforms/13_parse_unknown.yaml
# Log Format : Any — catches all events not matched by route_source_type
#              Events are preserved with raw message truncated to 200 chars.
# OCSF Class : Unknown (class_uid: 0, category_uid: 0)
# Source Type: _unmatched (Vector route fallback)
# Input      : route_source_type._unmatched
# Note       : These events are candidates for adding new parsers.
#              Monitor volume here to detect new undocumented log sources.
# ──────────────────────────────────────────────────────────────────────────────

transforms:
  parse_unknown:
    type: remap
    inputs:
      - route_source_type._unmatched
    source: |
      raw_str   = string!(.raw)
      src_obj   = object(.source) ?? {}
      uid       = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    0,
        "class_name":   "Unknown",
        "category_uid": 0,
        "activity_id":  0,
        "severity_id":  0,
        "severity":     "Unknown",
        "status":       "Other",
        "status_id":    99,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "message":      truncate(raw_str, 200),
        "metadata": {
          "uid":            uid,
          "version":        "1.3.0",
          "product":        { "name": "unknown", "vendor_name": "unknown", "version": "unknown" },
          "log_provider":   "unknown",
          "log_name":       to_string(src_obj.type) ?? "unknown",
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   to_string(.raw_format) ?? "unknown",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }
