# ──────────────────────────────────────────────────────────────────────────────
# ULPF Central Parser — OCSF Parser: IoT Telemetry Sensor (JSON)
# ──────────────────────────────────────────────────────────────────────────────
# Component  : central-parser
# File       : config/transforms/10_parse_iot_sensor.yaml
# Log Format : JSON — IoT/OT gateway telemetry
#              Fields: device_id, sensor_type, value, unit, status
# OCSF Class : Device Activity (class_uid: 2001, category_uid: 2)
# Source Type: iot.sensor
# Input      : route_source_type.iot_sensor
# ──────────────────────────────────────────────────────────────────────────────

transforms:
  parse_iot_sensor:
    type: remap
    inputs:
      - route_source_type.iot_sensor
    source: |
      raw_str     = to_string(.raw) ?? ""
      parsed      = parse_json(raw_str) ?? {}
      device_id   = string(parsed.device_id) ?? "unknown"
      sensor_type = string(parsed.sensor_type) ?? "unknown"
      value       = to_float(parsed.value) ?? 0.0
      unit        = string(parsed.unit) ?? ""
      stat_raw    = string(parsed.status) ?? "ok"
      dev_status  = downcase(stat_raw)

      sev_id   = if dev_status == "error" { 4 } else if dev_status == "warning" { 3 } else { 1 }
      sev_name = if dev_status == "error" { "High" } else if dev_status == "warning" { "Medium" } else { "Informational" }
      st_name  = if dev_status == "ok" { "Success" } else { "Failure" }
      st_id    = if dev_status == "ok" { 1 } else { 2 }

      src_obj   = object(.source) ?? {}
      event_id  = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    2001,
        "class_name":   "Device Activity",
        "category_uid": 2,
        "activity_id":  1,
        "severity_id":  sev_id,
        "severity":     sev_name,
        "status":       st_name,
        "status_id":    st_id,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "message":      device_id + " " + sensor_type + "=" + to_string(value) + unit + " [" + dev_status + "]",
        "device": {
          "uid":     device_id,
          "type_id": 17,
          "type":    "IoT Device"
        },
        "metadata": {
          "uid":            event_id,
          "version":        "1.3.0",
          "product": {
            "name":        to_string(src_obj.product) ?? "IoT",
            "vendor_name": to_string(src_obj.vendor) ?? "unknown",
            "version":     to_string(src_obj.product_version) ?? "unknown"
          },
          "log_provider":   "iot",
          "log_name":       to_string(src_obj.type) ?? "iot.sensor",
          "event_code":     null,
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "observables": [
          { "name": "device_id", "type_id": 1, "value": device_id }
        ],
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   "json",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }
