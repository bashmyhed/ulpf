# ──────────────────────────────────────────────────────────────────────────────
# ULPF Central Parser — OCSF Parser: Cisco ASA Firewall
# ──────────────────────────────────────────────────────────────────────────────
# Component  : central-parser
# File       : config/transforms/03_parse_cisco_asa.yaml
# Log Format : Syslog RFC 3164 — %ASA-<sev>-<msg_id>: <message>
# OCSF Class : Network Activity (class_uid: 4002, category_uid: 4)
# Source Type: fw.cisco.asa
# Input      : route_source_type.cisco_asa
# ──────────────────────────────────────────────────────────────────────────────

transforms:
  parse_cisco_asa:
    type: remap
    inputs:
      - route_source_type.cisco_asa
    source: |
      raw_str = to_string(.raw) ?? ""
      parsed  = parse_regex(raw_str, r'^%ASA-(?P<sev>\d)-(?P<msg_id>\d+):\s+(?P<msg>.+)$') ?? {}
      sev_num = to_int(parsed.sev) ?? 3
      msg_id  = string(parsed.msg_id) ?? ""
      msg_raw = string(parsed.msg) ?? raw_str
      msg     = if msg_raw != "" { msg_raw } else { raw_str }

      sev_id = if sev_num <= 2 { 5 } else if sev_num == 3 { 4 } else if sev_num == 4 { 3 } else if sev_num == 5 { 2 } else if sev_num == 6 { 1 } else { 0 }
      sev_name = if sev_id == 5 { "Critical" } else if sev_id == 4 { "High" } else if sev_id == 3 { "Medium" } else if sev_id == 2 { "Low" } else { "Informational" }

      ip_m   = parse_regex(msg, r'(?P<src>\d+\.\d+\.\d+\.\d+)[:/]?(?P<spt>\d+)?\s*-?(?:->)?\s*(?P<dst>\d+\.\d+\.\d+\.\d+)?') ?? {}
      src_ip = string(ip_m.src) ?? ""
      dst_ip = string(ip_m.dst) ?? ""
      src_pt = to_int(ip_m.spt) ?? 0

      msg_lo = downcase(msg)
      act_id = if contains(msg_lo, "permitted") || contains(msg_lo, "allowed") { 1 } else if contains(msg_lo, "denied") || contains(msg_lo, "deny") { 2 } else { 0 }
      st_name = if act_id == 1 { "Success" } else if act_id == 2 { "Failure" } else { "Other" }
      st_id   = if act_id == 1 { 1 } else if act_id == 2 { 2 } else { 99 }

      src_obj   = object(.source) ?? {}
      event_id  = to_string(.event_id) ?? ""
      coll_time = to_int(.collected_at) ?? 0
      ing_time  = to_int(.ingested_at) ?? 0
      integrity = object(.integrity) ?? {}

      . = {
        "class_uid":    4002,
        "class_name":   "Network Activity",
        "category_uid": 4,
        "activity_id":  act_id,
        "severity_id":  sev_id,
        "severity":     sev_name,
        "status":       st_name,
        "status_id":    st_id,
        "time":         to_unix_timestamp(now()),
        "@timestamp":   coll_time,
        "message":      msg,
        "src_endpoint": { "ip": src_ip, "port": src_pt, "type_id": 1 },
        "dst_endpoint": { "ip": dst_ip, "type_id": 1 },
        "metadata": {
          "uid":            event_id,
          "version":        "1.3.0",
          "product": {
            "name":        to_string(src_obj.product) ?? "ASA",
            "vendor_name": to_string(src_obj.vendor) ?? "Cisco",
            "version":     to_string(src_obj.product_version) ?? "unknown"
          },
          "log_provider":   "syslog",
          "log_name":       to_string(src_obj.type) ?? "fw.cisco.asa",
          "event_code":     msg_id,
          "logged_time":    coll_time,
          "processed_time": ing_time,
          "integrity":      integrity
        },
        "observables": [
          { "name": "src_ip", "type_id": 2, "value": src_ip },
          { "name": "dst_ip", "type_id": 2, "value": dst_ip }
        ],
        "unmapped": {
          "site":         to_string(.site_name) ?? (if to_string(.site_id) == "kol-dc1" { "Site A" } else if to_string(.site_id) == "del-dc2" { "Site B" } else if to_string(.site_id) == "mum-dc3" { "Site C" } else { "Site A" }),
          "site_id":      to_string(.site_id) ?? "unknown",
          "agent_id":     to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "collector_id": to_string(.agent_id) ?? to_string(.collector_id) ?? "unknown",
          "raw_format":   to_string(.raw_format) ?? "syslog3164",
          "source_tz":    to_string(.source_tz) ?? "UTC",
          "kafka": {
            "topic":     to_string(.topic) ?? "",
            "partition": to_int(.partition) ?? 0,
            "offset":    to_int(.offset) ?? 0
          },
          "source_path": to_string(src_obj.position.path) ?? ""
        }
      }
