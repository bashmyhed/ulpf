<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULPF · ML findings</title><style>body{font:16px system-ui;background:#0c1525;color:#e8edf6;margin:36px auto;max-width:1100px;padding:0 20px}a{color:#83c5ff}h1{font-size:28px}p{color:#b2bfd1}article{background:#14223a;border:1px solid #30445f;border-radius:12px;padding:20px;margin:14px 0}code{color:#9fd7ff}small{color:#b2bfd1}button{padding:10px 18px;border:0;border-radius:7px;cursor:pointer}pre{white-space:pre-wrap}#status{margin:20px 0}</style><a href="/">← Pipeline dashboard</a><h1>Behavioral anomaly findings</h1><p>Unusual activity for review. Scores are not attack probabilities.</p><button id="refresh">Refresh</button><div id="status"></div><main id="findings"></main><script>
async function load(){const status=document.getElementById('status'),root=document.getElementById('findings');status.textContent='Loading…';try{const r=await fetch('/api/ml/findings');const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');root.replaceChildren();for(const f of data.findings){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),e=document.createElement('pre');h.textContent=`${f.family}: ${f.entity}`;p.textContent=`${new Date(f.start*1000).toISOString()} · ${f.count} events · score ${f.anomaly_score?.toFixed(3)??'not scored'} / threshold ${f.threshold?.toFixed(3)??'—'}`;e.textContent=JSON.stringify({status:f.status,rule_signals:f.rule_signals,evidence:f.evidence},null,2);a.append(h,p,e);root.append(a)}status.textContent=data.findings.length?`${data.findings.length} recent anomaly findings`:'No anomaly findings yet. Check the worker health if no events have been scored.'}catch(e){status.textContent='Findings unavailable: '+e.message}}document.getElementById('refresh').onclick=load;load();</script></html>
